name: Test Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  contract:
    name: contract_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            MetaRec-backend/requirements.txt
            MetaRec-backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: MetaRec-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Export OpenAPI contract
        run: python MetaRec-backend/scripts/export_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MetaRec-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: MetaRec-ui
        run: npm ci

      - name: Generate frontend contract types
        working-directory: MetaRec-ui
        run: npm run contract:gen

      - name: Validate OpenAPI contract (semantic)
        run: npx --yes @redocly/cli bundle contracts/metarec-openapi.json -o /tmp/metarec-openapi.bundle.json

      - name: Validate generated contract types compile
        working-directory: MetaRec-ui
        run: npx tsc --noEmit

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            contracts/metarec-openapi.json
            MetaRec-ui/src/contracts/openapi-types.ts
          if-no-files-found: error
          retention-days: 14

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend_unit
            stack: frontend
            workdir: MetaRec-ui
            command: npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit=reports/frontend-unit.junit.xml
            report: reports/frontend-unit.junit.xml
          - name: frontend_render
            stack: frontend
            workdir: MetaRec-ui
            command: npm run test:render -- --reporter=default --reporter=junit --outputFile.junit=reports/frontend-render.junit.xml
            report: reports/frontend-render.junit.xml
          - name: backend_unit
            stack: backend
            workdir: MetaRec-backend
            command: python -m pytest -q -m backend_unit --junitxml=reports/backend-unit.junit.xml
            report: reports/backend-unit.junit.xml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.stack == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: MetaRec-ui/package-lock.json

      - name: Install frontend dependencies
        if: matrix.stack == 'frontend'
        working-directory: MetaRec-ui
        run: npm ci

      - name: Set up Python
        if: matrix.stack == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            MetaRec-backend/requirements.txt
            MetaRec-backend/requirements-dev.txt

      - name: Install backend dependencies
        if: matrix.stack == 'backend'
        working-directory: MetaRec-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: |
          mkdir -p reports
          ${{ matrix.command }}

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-junit
          path: ${{ matrix.workdir }}/${{ matrix.report }}
          if-no-files-found: warn
          retention-days: 14

  backend_runtime_contracts:
    name: backend_runtime_contracts
    runs-on: ubuntu-latest
    needs: contract
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metarec
          POSTGRES_PASSWORD: metarec
          POSTGRES_DB: metarec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metarec -d metarec"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://metarec:metarec@localhost:5432/metarec?sslmode=disable
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            MetaRec-backend/requirements.txt
            MetaRec-backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: MetaRec-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply business database migrations
        working-directory: MetaRec-backend
        run: alembic upgrade head

      - name: Run runtime contract tests
        working-directory: MetaRec-backend
        run: |
          mkdir -p reports
          python -m pytest -q -m runtime_contract --junitxml=reports/backend-runtime-contracts.junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend_runtime_contracts-junit
          path: MetaRec-backend/reports/backend-runtime-contracts.junit.xml
          if-no-files-found: warn
          retention-days: 14

  deploy_hf_space:
    name: Deploy Hugging Face Space
    runs-on: ubuntu-latest
    needs:
      - test
      - backend_runtime_contracts
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.backend_runtime_contracts.result == 'success'
    concurrency:
      group: hf-space-${{ github.ref }}
      cancel-in-progress: false
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID || secrets.HF_SPACE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Hugging Face deployment config
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_SPACE_ID" || (echo "HF_SPACE_ID must be set as a repository variable or secret, e.g. user-name/space-name" && exit 1)
          test -n "$HF_TOKEN" || (echo "HF_TOKEN must be set as a repository secret with write access to the Space" && exit 1)

      - name: Sync repository to Hugging Face Space
        uses: huggingface/hub-sync@6fbce0a787a7146710e588abe7a4fd5eca07f47c # v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs:
      - test
      - backend_runtime_contracts
    if: always()
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-reports
          pattern: "*-junit"
          merge-multiple: true

      - name: Publish PR test summary
        continue-on-error: true
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: junit-summary
          path: test-reports/*.xml
          reporter: java-junit
          fail-on-error: false
